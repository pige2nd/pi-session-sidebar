name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Run unit and state tests
        env:
          LANG: C.UTF-8
        run: python3 test_sidebar.py IndexTest MouseResizeTest
